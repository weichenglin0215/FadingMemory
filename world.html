<!-- ═══════════════════════════════════════════════════════════════════
     world.html — 「出去走走」3D 場景頁
     跟其他頁不同的地方：畫面分成兩層——
       #world：Three.js 畫 3D 城市的 <canvas> 會被塞進這裡，這一層「不」被
         js/stage.js 的縮放邏輯處理（3D 渲染要用瀏覽器實際的像素尺寸，被 CSS
         transform 縮放的話畫面會模糊/變形），是另外用 Three.js 自己的相機
         設定去對齊視窗大小。
       #stage（這裡帶 class="stage--overlay"，跟其他頁的 #stage 用途不同）：
         疊在 3D 畫面上面的 2D 操作介面（搖桿、按鈕、小地圖…），固定 500×850
         的邏輯尺寸，縮放置中的方式跟其他頁一樣；只有標了 .hit 的元件會接收
         觸控／點擊，其餘地方讓觸控穿透到底下的 3D 畫面（可以直接在 3D 場景
         裡點擊/拖曳視角）。
     3D 場景、人物移動、劇情邏輯是 world.html 專屬的程式碼（不在 js/ 資料夾
     列出的檔案清單裡，是透過 js/boot.js 另外載入的一大包 3D 相關檔案）。
     ═══════════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>出去走走 — 記憶模糊</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">

    <!-- 版本檢查＋載入：見 js/boot.js（Three.js 優先用 vendor/ 本地檔，失敗才用 CDN） -->
    <style>html:not(.stage-ready) body { visibility: hidden; }</style>
    <script>window.FM_PAGE = 'world';</script>
    <script>document.write('<script src="js/boot.js?t=' + Date.now() + '"><\/script>');</script>
</head>

<body>
    <!-- 3D 畫布層（不被 CSS 縮放，stage.js 負責對齊） -->
    <div id="world"></div>

    <!-- 2D 介面層（500×850，疊在 3D 上；只有 .hit 元件吃觸控） -->
    <div id="stage" class="stage--overlay">
        <div id="hud"></div>
    </div>
</body>

</html>
