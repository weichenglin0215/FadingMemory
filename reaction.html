<!-- ═══════════════════════════════════════════════════════════════════
     reaction.html — 「秒反應」小遊戲的遊戲頁（骨架頁，幾乎沒有內容）
     跟 quiz.html 同一個套路：這裡只搭空殼，真正的畫面由 JS 動態塞進 #screen。
     流程：js/reaction.js 讀 ?game= 參數決定玩哪一款（找不到才隨機挑），
     找到對應的遊戲模組（js/reaction_speed.js／reaction_drop.js／reaction_spot.js，
     透過 js/reaction_core.js 的 Reaction.register() 註冊進來），呼叫它的 mount()
     把畫面畫進 #screen。要改某一款遊戲的玩法/畫面，去改對應的 reaction_*.js。
     ═══════════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>秒反應 — 記憶模糊</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">

    <!-- 版本檢查＋載入：見 js/boot.js -->
    <style>html:not(.stage-ready) body { visibility: hidden; }</style>
    <script>window.FM_PAGE = 'reaction';</script>
    <script>document.write('<script src="js/boot.js?t=' + Date.now() + '"><\/script>');</script>
</head>

<body>
    <div id="stage">
        <!-- 頂部固定列：返回鍵、標題（會被改成目前這款遊戲的名字）、meta（例如「最佳 1000 分」）、
             右上角「喇叭」（#bar-sound）：開關音效（js/sfx.js）；
             右上角「?」（#bar-help）：點了重新彈出這款遊戲的玩法說明（Dlg.rule）。 -->
        <div class="bar">
            <button class="bar__back" id="bar-back"></button>
            <!-- 標題與 meta 上下疊在中間：喇叭＋「?」兩顆圓鈕占掉右側空間後，
                 兩者橫排會把遊戲名稱擠成「…」，所以改成上下兩行 -->
            <div class="bar__mid">
                <div class="bar__title" id="bar-title">秒反應</div>
                <div class="bar__meta" id="bar-meta"></div>
            </div>
            <button class="bar__help bar__sound" id="bar-sound" type="button" aria-label="音效"></button>
            <button class="bar__help" id="bar-help">?</button>
        </div>
        <!-- #screen：目前這款小遊戲的畫面，由該遊戲模組的 mount(root, ctx) 函式畫進來 -->
        <div class="screen" id="screen"></div>
        <!-- 玩法說明、排行榜、結算等彈窗都由 js/dialog.js 的 Dlg.open 動態加進 #stage（蓋在標題列下面）；
             進遊戲時會先彈一次玩法說明，之後按「?」可以重看 -->
    </div>
</body>

</html>
